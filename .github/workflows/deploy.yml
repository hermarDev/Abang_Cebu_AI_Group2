name: Production Build & Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: "Deploy to production after image build"
        required: true
        type: boolean
        default: true
      skip_ci_verification:
        description: "Skip CI verification (emergency override only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify CI & Secret Scan Passed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.skip_ci_verification != 'true'
    steps:
      - name: Await CI workflow completion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Verifying CI and secret scanning status for commit: $TARGET_SHA"

          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            # Fetch recent CI runs for ci.yml
            RUN_DATA=$(gh run list --repo "$GH_REPO" --workflow=ci.yml --json headSha,status,conclusion,databaseId --limit 20)
            MATCH=$(echo "$RUN_DATA" | jq -c --arg sha "$TARGET_SHA" '.[] | select(.headSha == $sha)' | head -n 1)

            if [ -n "$MATCH" ]; then
              STATUS=$(echo "$MATCH" | jq -r '.status')
              CONCLUSION=$(echo "$MATCH" | jq -r '.conclusion')
              RUN_ID=$(echo "$MATCH" | jq -r '.databaseId')

              echo "Found CI run #$RUN_ID for commit $TARGET_SHA (status=$STATUS, conclusion=$CONCLUSION)"

              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "✅ CI checks and secret scanning PASSED for commit $TARGET_SHA."
                  exit 0
                else
                  echo "❌ ERROR: CI checks did not succeed (conclusion: $CONCLUSION). Aborting deployment."
                  exit 1
                fi
              fi
            else
              echo "CI run for commit $TARGET_SHA not registered yet. Waiting 10s ($((ATTEMPT + 1))/$MAX_ATTEMPTS)..."
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done

          echo "❌ ERROR: Timed out waiting for CI workflow to complete for $TARGET_SHA after 10 minutes."
          exit 1

  build-and-publish:
    name: Build & Publish Image to GHCR
    needs: [verify-ci]
    if: always() && (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.APP_URL || 'https://abangcebu.tech' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_MAP_STYLE_URL=/styles/osm.json
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}

  deploy-production:
    name: Deploy to Production EC2
    needs: [build-and-publish]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.deploy_to_production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://abangcebu.tech
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d # v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST || '100.113.204.110' }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/abangcebu

            echo "Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Record currently running image ID/tag for automatic rollback if health check fails
            PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' abangcebu-app 2>/dev/null || echo "")
            echo "Currently running image: ${PREV_IMAGE:-none}"

            export IMAGE_TAG="${{ needs.build-and-publish.outputs.image_tag }}"
            echo "Deploying target image tag: ${IMAGE_TAG}"

            echo "Pulling target image..."
            docker compose pull abangcebu-app

            echo "Starting container with zero-downtime transition..."
            docker compose up -d --remove-orphans abangcebu-app

            echo "Verifying healthcheck endpoint..."
            HEALTHY=false
            for i in $(seq 1 20); do
              if curl -s -f http://127.0.0.1:3000/api/health > /dev/null; then
                echo "Container healthy on check $i/20!"
                HEALTHY=true
                break
              fi
              echo "Waiting for container to become healthy ($i/20)..."
              sleep 2
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "✅ Deployment verified healthy! Pruning stale images..."
              docker image prune -f
              exit 0
            fi

            echo "🚨 ERROR: Health check failed after 40 seconds!"
            echo "Dumping recent container logs:"
            docker logs abangcebu-app --tail 100

            if [ -n "$PREV_IMAGE" ]; then
              echo "⚠️ Initiating automated rollback to previous image: $PREV_IMAGE..."
              PREV_TAG=$(echo "$PREV_IMAGE" | awk -F: '{print $2}')
              if [ -n "$PREV_TAG" ]; then
                IMAGE_TAG="$PREV_TAG" docker compose up -d --remove-orphans abangcebu-app
              else
                docker compose up -d --remove-orphans abangcebu-app
              fi
              echo "Verifying rolled-back container status..."
              sleep 3
              if curl -s -f http://127.0.0.1:3000/api/health > /dev/null; then
                echo "✅ Rollback successful: Previous healthy container state restored."
              else
                echo "❌ CRITICAL: Rolled-back container also failed healthcheck!"
              fi
            fi

            exit 1
