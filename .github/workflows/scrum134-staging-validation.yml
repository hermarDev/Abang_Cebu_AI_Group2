name: SCRUM-134 staging template validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/scrum134-staging-validation.yml'
      - 'infra/aws/staging/**'
      - 'scripts/validate_scrum134_staging.py'
      - 'scripts/requirements-infra-validation.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: staging-template-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-infra-validation.txt

      - name: Install validator dependencies
        run: python -m pip install --requirement scripts/requirements-infra-validation.txt

      - name: Validate staging template
        run: python -m unittest scripts/validate_scrum134_staging.py -v
