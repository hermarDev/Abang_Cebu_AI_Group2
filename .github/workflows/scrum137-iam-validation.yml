name: SCRUM-137 IAM template validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/scrum137-iam-validation.yml'
      - 'infra/aws/iam/roles.template.json'
      - 'scripts/validate_scrum137_iam.py'
      - 'docs/security/iam-policies.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: iam-template-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate IAM template
        run: |
          python -m unittest scripts/validate_scrum137_iam.py -v
          python -m json.tool infra/aws/iam/roles.template.json > /dev/null
