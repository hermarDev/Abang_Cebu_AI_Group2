services:
  abangcebu-app:
    image: ghcr.io/hermardev/abangcebuai:latest
    container_name: abangcebu-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Bound strictly to host loopback so all incoming traffic traverses Caddy
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          cpus: "1.75"
          memory: 2048M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
