<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1550" width="1050" height="1550" style="background:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker for end of lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <!-- Arrow marker for start of lines (bidirectional) -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000000" />
    </marker>
    <!-- Pattern for grid background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Grid Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Flowchart Title -->
  <text x="525.0" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000" letter-spacing="1">SCRUM-126: ADMIN KYC VERIFICATION REVIEW</text>

  <!-- ==================== CONNECTING EDGES ==================== -->
  <!-- node_start -> node_auth -->
  <line x1="500.0" y1="130.0" x2="500.0" y2="165.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_auth -> node_deny -->
  <path d="M 420 210 L 350 210" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="202" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_deny -> node_conn_e1 -->
  <line x1="160.0" y1="210.0" x2="110.0" y2="210.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_auth -> node_queue -->
  <line x1="500.0" y1="255.0" x2="500.0" y2="295.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="275" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_queue -> node_current -->
  <line x1="500.0" y1="350.0" x2="500.0" y2="385.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_current -> node_stale -->
  <path d="M 420 430 L 350 430" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="422" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_stale -> node_queue -->
  <path d="M 255 402.5 L 255 322.5 L 370 322.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_current -> node_inspect -->
  <line x1="500.0" y1="475.0" x2="500.0" y2="515.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="495" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_inspect -> node_sufficient -->
  <line x1="500.0" y1="575.0" x2="500.0" y2="610.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_sufficient -> node_insufficient -->
  <path d="M 420 655 L 360 655" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="380" y="647" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_insufficient -> node_conn_e2 -->
  <line x1="160.0" y1="655.0" x2="110.0" y2="655.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_sufficient -> node_outcome -->
  <line x1="500.0" y1="700.0" x2="500.0" y2="740.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="720" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_outcome -> node_verified -->
  <line x1="500.0" y1="830.0" x2="500.0" y2="870.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="850" font-size="11" font-weight="normal" fill="#000000">Verified</text>
  <!-- node_outcome -> node_reason -->
  <path d="M 420 785 L 335 785" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="360" y="777" font-size="11" font-weight="normal" fill="#000000">Rejected</text>
  <!-- node_reason -> node_reason_missing -->
  <path d="M 255 830 L 255 870" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="262" y="850" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_reason_missing -> node_reason -->
  <path d="M 160 897.5 L 130 897.5 L 130 785 L 175 785" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_reason -> node_rejected -->
  <path d="M 255 830 L 255 990" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="262" y="940" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_verified -> node_db -->
  <path d="M 630 900 L 780 900" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="705" y="890" font-size="11" font-weight="normal" fill="#000000">Persist Audit</text>
  <!-- node_verified -> node_notify -->
  <line x1="500.0" y1="930.0" x2="500.0" y2="1090.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_rejected -> node_notify -->
  <path d="M 255 1050 L 255 1117.5 L 380 1117.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_notify -> node_delivered -->
  <line x1="500.0" y1="1145.0" x2="500.0" y2="1185.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_delivered -> node_retry -->
  <path d="M 420 1230 L 350 1230" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="1222" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_retry -> node_notify -->
  <path d="M 255 1202.5 L 255 1117.5 L 380 1117.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_delivered -> node_end -->
  <line x1="500.0" y1="1275.0" x2="500.0" y2="1335.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="1300" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_conn_e_recv -> node_end -->
  <line x1="310.0" y1="1360.0" x2="420.0" y2="1360.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== FLOWCHART NODES ==================== -->
  <!-- Node: node_start -->
  <rect x="420" y="80" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="110.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">START</text>
  <!-- Node: node_auth -->
  <polygon points="500.0,165 580,210.0 500.0,255 420,210.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="206.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Authenticated Active</text>
  <text x="500.0" y="221.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Admin?</text>
  <!-- Node: node_deny -->
  <polygon points="185,182.5 350,182.5 325,237.5 160,237.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="206.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Deny Access</text>
  <text x="255.0" y="222.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">No KYC Data Disclosed</text>
  <!-- Node: node_conn_e1 -->
  <circle cx="85.0" cy="210.0" r="25.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="85.0" y="215.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">E</text>
  <text x="85.0" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Exit</text>
  <!-- Node: node_queue -->
  <polygon points="395,295 630,295 605,350 370,350" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="318.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Admin Verification Portal:</text>
  <text x="500.0" y="334.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Retrieve Eligible Pending KYC Submissions</text>
  <!-- Node: node_current -->
  <polygon points="500.0,385 580,430.0 500.0,475 420,430.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="426.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Pending Record</text>
  <text x="500.0" y="441.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Exists?</text>
  <!-- Node: node_stale -->
  <polygon points="185,402.5 350,402.5 325,457.5 160,457.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="426.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Stale / Reviewed Record</text>
  <text x="255.0" y="442.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Reload Queue</text>
  <!-- Node: node_inspect -->
  <polygon points="390,515 635,515 610,575 365,575" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="541.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Inspect Identity / Government ID &amp;</text>
  <text x="500.0" y="557.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Document Evidence (Private Storage)</text>
  <!-- Node: node_sufficient -->
  <polygon points="500.0,610 580,655.0 500.0,700 420,655.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="651.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Evidence</text>
  <text x="500.0" y="666.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Sufficient?</text>
  <!-- Node: node_insufficient -->
  <polygon points="185,627.5 360,627.5 335,682.5 160,682.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="260.0" y="651.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Insufficient Evidence</text>
  <text x="260.0" y="667.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Request Correction via Owner Flow</text>
  <!-- Node: node_conn_e2 -->
  <circle cx="85.0" cy="655.0" r="25.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="85.0" y="660.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">E</text>
  <text x="85.0" y="698" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Exit</text>
  <!-- Node: node_outcome -->
  <polygon points="500.0,740 580,785.0 500.0,830 420,785.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="781.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Verification</text>
  <text x="500.0" y="796.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Outcome?</text>
  <!-- Node: node_verified -->
  <rect x="370" y="870" width="260" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="896.4000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Persist Verified Status +</text>
  <text x="500.0" y="912.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Reviewer ID, Timestamp &amp; Audit Log</text>
  <!-- Node: node_reason -->
  <polygon points="255.0,740 335,785.0 255.0,830 175,785.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="781.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Actionable Reason</text>
  <text x="255.0" y="796.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Present?</text>
  <!-- Node: node_reason_missing -->
  <polygon points="185,870 350,870 325,925 160,925" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="893.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Prompt Required Reason</text>
  <text x="255.0" y="909.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(No State Mutation)</text>
  <!-- Node: node_rejected -->
  <rect x="160" y="990" width="190" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="1016.4000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Persist Rejected Status +</text>
  <text x="255.0" y="1032.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Reason &amp; Admin Audit Log</text>
  <!-- Node: node_db -->
  <g>
    <path d="M 780 870 A 65.0 15 0 0 0 910 870 A 65.0 15 0 0 0 780 870 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 870 L 780 930 A 65.0 15 0 0 0 910 930 L 910 870" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 930 A 65.0 15 0 0 0 910 930" fill="none" stroke="#000000" stroke-width="1.8" />
    <text x="845.0" y="904.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Landlord KYC</text>
  </g>
  <!-- Node: node_notify -->
  <polygon points="380,1090 620,1090 620,1127.4 500.0,1145 380,1127.4" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1102.1" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Notify Landlord of Outcome</text>
  <text x="500.0" y="1116.3999999999999" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">via Configured Channel</text>
  <!-- Node: node_delivered -->
  <polygon points="500.0,1185 580,1230.0 500.0,1275 420,1230.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1226.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Notification</text>
  <text x="500.0" y="1241.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Delivered?</text>
  <!-- Node: node_retry -->
  <polygon points="185,1202.5 350,1202.5 325,1257.5 160,1257.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="1226.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Delivery Failed</text>
  <text x="255.0" y="1242.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Retry Notification Dispatch</text>
  <!-- Node: node_conn_e_recv -->
  <circle cx="285.0" cy="1360.0" r="25.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="285.0" y="1365.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">E</text>
  <text x="285.0" y="1403" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">From Exits</text>
  <!-- Node: node_end -->
  <rect x="420" y="1335" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="1365.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">END</text>

</svg>