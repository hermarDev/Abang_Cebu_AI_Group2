<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1450" width="1050" height="1450" style="background:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker for end of lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <!-- Arrow marker for start of lines (bidirectional) -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000000" />
    </marker>
    <!-- Pattern for grid background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Grid Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Flowchart Title -->
  <text x="525.0" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000" letter-spacing="1">SCRUM-126: MODULE 4 — ADMIN MASTER ORCHESTRATION</text>

  <!-- ==================== CONNECTING EDGES ==================== -->
  <!-- node_start -> node_role_gate -->
  <line x1="500.0" y1="130.0" x2="500.0" y2="170.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_role_gate -> node_access_denied -->
  <path d="M 400 210 L 360 210" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="202" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_access_denied -> node_end -->
  <path d="M 180 210 L 100 210 L 100 1370 L 420 1370" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_role_gate -> node_dashboard_queue -->
  <line x1="500.0" y1="250.0" x2="500.0" y2="290.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="265" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_conn_a_entry -> node_dashboard_queue -->
  <line x1="310.0" y1="320.0" x2="360.0" y2="320.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_dashboard_queue -> node_db_queues -->
  <path d="M 640 320 L 780 320" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-start="url(#arrow-start)" marker-end="url(#arrow)" />
  <text x="675" y="310" font-size="11" font-weight="normal" fill="#000000">SELECT pending</text>
  <!-- node_dashboard_queue -> node_queue_selector -->
  <line x1="500.0" y1="350.0" x2="500.0" y2="390.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_queue_selector -> node_sub_kyc_review -->
  <path d="M 410 430 L 280 430 L 280 500" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="315" y="422" font-size="11" font-weight="normal" fill="#000000">KYC Review</text>
  <!-- node_queue_selector -> node_sub_listing_mod -->
  <path d="M 590 430 L 770 430 L 770 500" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="645" y="422" font-size="11" font-weight="normal" fill="#000000">Listing Review</text>
  <!-- node_sub_kyc_review -> node_violation_eval -->
  <path d="M 280 560 L 280 645 L 410 645" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_sub_listing_mod -> node_violation_eval -->
  <path d="M 770 560 L 770 645 L 590 645" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_violation_eval -> node_suspension_protocol -->
  <path d="M 410 645 L 360 645" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="365" y="637" font-size="11" font-weight="normal" fill="#000000">YES (Severe)</text>
  <!-- node_suspension_protocol -> node_commit_audit -->
  <path d="M 270 672.5 L 270 847.5 L 360 847.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
