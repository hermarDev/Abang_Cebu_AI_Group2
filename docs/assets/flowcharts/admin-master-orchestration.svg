  <g>
    <path d="M 780 300 A 90.0 15 0 0 0 960 300 A 90.0 15 0 0 0 780 300 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 300 L 780 340 A 90.0 15 0 0 0 960 340 L 960 300" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 340 A 90.0 15 0 0 0 960 340" fill="none" stroke="#000000" stroke-width="1.8" />
    <text x="870.0" y="324.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Database (Supabase)</text>
  </g>
  <!-- Node: node_queue_selector -->
  <polygon points="500.0,390 590,430.0 500.0,470 410,430.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="426.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Queue Selection:</text>
  <text x="500.0" y="441.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Moderate Listings or KYC?</text>
  <!-- Node: node_sub_kyc_review -->
  <polygon points="180,500 380,500 380,540.8 280.0,560 180,540.8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="280.0" y="513.85" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Sub-Process 4.1:</text>
  <text x="280.0" y="528.15" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Admin KYC Verification Review</text>
  <!-- Node: node_sub_listing_mod -->
  <polygon points="670,500 870,500 870,540.8 770.0,560 670,540.8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="770.0" y="513.85" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Sub-Process 4.2:</text>
  <text x="770.0" y="528.15" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Admin Listing Moderation Flow</text>
  <!-- Node: node_violation_eval -->
  <polygon points="500.0,605 590,645.0 500.0,685 410,645.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="641.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Severe Violation Detected?</text>
  <text x="500.0" y="656.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">(Fraud / Illegal / Repeated)</text>
  <!-- Node: node_suspension_protocol -->
  <rect x="180" y="617.5" width="180" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="270.0" y="641.4000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Initiate Suspension Protocol:</text>
  <text x="270.0" y="657.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Freeze Entity &amp; Account</text>
  <!-- Node: node_standard_decision -->
  <rect x="400" y="725" width="200" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="748.9000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Record Standard Approve / Reject</text>
  <text x="500.0" y="764.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Outcome with Justification</text>
  <!-- Node: node_commit_audit -->
  <rect x="360" y="820" width="280" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="843.9000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Commit Decision to Immutable Audit Log</text>
  <text x="500.0" y="859.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(admin_decision_audit)</text>
  <!-- Node: node_audit_db -->
  <g>
    <path d="M 780 827.5 A 90.0 15 0 0 0 960 827.5 A 90.0 15 0 0 0 780 827.5 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 827.5 L 780 867.5 A 90.0 15 0 0 0 960 867.5 L 960 827.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 867.5 A 90.0 15 0 0 0 960 867.5" fill="none" stroke="#000000" stroke-width="1.8" />
    <text x="870.0" y="851.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Audit Database (Append-Only)</text>
  </g>
  <!-- Node: node_dispatch_events -->
  <rect x="360" y="915" width="280" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="938.9000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Dispatch Real-Time Events &amp; Notifications</text>
  <text x="500.0" y="954.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(Webhooks, In-App Alerts, Email)</text>
  <!-- Node: node_sync_type -->
  <polygon points="500.0,1010 590,1050.0 500.0,1090 410,1050.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1046.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Target Entity Type:</text>
  <text x="500.0" y="1061.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Listing or User/KYC?</text>
  <!-- Node: node_kyc_role_sync -->
  <polygon points="180,1120 380,1120 380,1160.8 280.0,1180 180,1160.8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="280.0" y="1133.85" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Update Landlord Role State</text>
  <text x="280.0" y="1148.1499999999999" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Unlock Submission (SCRUM-125)</text>
  <!-- Node: node_map_cache_sync -->
  <polygon points="670,1120 870,1120 870,1160.8 770.0,1180 670,1160.8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="770.0" y="1133.85" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Update Spatial Map Index</text>
  <text x="770.0" y="1148.1499999999999" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Invalidate Cache (SCRUM-118)</text>
  <!-- Node: node_session_check -->
  <polygon points="500.0,1225 590,1265.0 500.0,1305 410,1265.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1261.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Continue Reviewing Queue</text>
  <text x="500.0" y="1276.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">or Exit Portal?</text>
  <!-- Node: node_conn_a_return -->
  <circle cx="705.0" cy="1265.0" r="25.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="705.0" y="1270.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">A</text>
  <text x="705.0" y="1308" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Return to Queue</text>
  <!-- Node: node_end -->
  <rect x="420" y="1345" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="1375.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">END: Admin Operations</text>

</svg>