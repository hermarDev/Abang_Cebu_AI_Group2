  <text x="508" y="1315" font-size="11" font-weight="normal" fill="#000000">Exit</text>

  <!-- ==================== FLOWCHART NODES ==================== -->
  <!-- Node: node_start -->
  <rect x="420" y="80" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="110.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">START: Admin Session Initialized</text>
  <!-- Node: node_role_gate -->
  <polygon points="500.0,170 600,210.0 500.0,250 400,210.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="206.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">User Has Admin / SuperAdmin</text>
  <text x="500.0" y="221.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Role &amp; Valid JWT Claims?</text>
  <!-- Node: node_access_denied -->
  <polygon points="205,182.5 360,182.5 335,237.5 180,237.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="270.0" y="206.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">403 Forbidden / Access Denied</text>
  <text x="270.0" y="222.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Log Security Event &amp; Terminate</text>
  <!-- Node: node_conn_a_entry -->
  <circle cx="285.0" cy="320.0" r="25.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="285.0" y="325.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">A</text>
  <text x="285.0" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Queue Loop</text>
  <!-- Node: node_dashboard_queue -->
  <polygon points="385,290 640,290 615,350 360,350" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="316.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Admin Operations Portal:</text>
  <text x="500.0" y="332.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Load Moderation Queues &amp; Metric Summaries</text>
