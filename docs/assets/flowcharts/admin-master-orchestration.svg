  <text x="675" y="837" font-size="11" font-weight="normal" fill="#000000">INSERT log</text>
  <!-- node_commit_audit -> node_dispatch_events -->
  <line x1="500.0" y1="875.0" x2="500.0" y2="915.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_dispatch_events -> node_sync_type -->
  <line x1="500.0" y1="970.0" x2="500.0" y2="1010.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_sync_type -> node_kyc_role_sync -->
  <path d="M 410 1050 L 280 1050 L 280 1120" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="315" y="1042" font-size="11" font-weight="normal" fill="#000000">User / KYC</text>
  <!-- node_sync_type -> node_map_cache_sync -->
  <path d="M 590 1050 L 770 1050 L 770 1120" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="645" y="1042" font-size="11" font-weight="normal" fill="#000000">Listing</text>
  <!-- node_kyc_role_sync -> node_session_check -->
  <path d="M 280 1180 L 280 1265 L 410 1265" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_map_cache_sync -> node_session_check -->
  <path d="M 770 1180 L 770 1265 L 590 1265" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_session_check -> node_conn_a_return -->
  <line x1="590.0" y1="1265.0" x2="680.0" y2="1265.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="625" y="1255" font-size="11" font-weight="normal" fill="#000000">Continue</text>
  <!-- node_session_check -> node_end -->
