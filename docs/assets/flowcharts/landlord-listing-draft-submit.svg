  <text x="500.0" y="566.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Save Draft</text>
  <text x="500.0" y="581.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">or Submit?</text>
  <!-- Node: node_draft_validate -->
  <rect x="150" y="650" width="210" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="676.4000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Validate Ownership &amp;</text>
  <text x="255.0" y="692.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Draft-Safe Partial Input</text>
  <!-- Node: node_draft_result -->
  <polygon points="255.0,750 335,795.0 255.0,840 175,795.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="791.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Draft Save</text>
  <text x="255.0" y="806.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Succeeded?</text>
  <!-- Node: node_draft_saved -->
  <rect x="150" y="880" width="210" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="903.9000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Saved Draft State</text>
  <text x="255.0" y="919.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(Private &amp; Non-Public)</text>
  <!-- Node: node_draft_retry -->
  <rect x="150" y="975" width="210" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="998.9000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Save Failed / Retain Input</text>
  <text x="255.0" y="1014.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Check State &amp; Retry in Editor</text>
  <!-- Node: node_submit_validate -->
  <rect x="370" y="650" width="260" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="676.4000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Validate Complete Property, Units,</text>
  <text x="500.0" y="692.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Required Media &amp; KYC Policy</text>
  <!-- Node: node_submit_valid -->
  <polygon points="500.0,750 580,795.0 500.0,840 420,795.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="791.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Complete &amp;</text>
  <text x="500.0" y="806.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Eligible?</text>
  <!-- Node: node_fix_input -->
  <rect x="740" y="767.5" width="200" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="840.0" y="791.4000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Field Errors / Conflict</text>
  <text x="840.0" y="807.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Reconcile in Editor</text>
  <!-- Node: node_pending_snapshot -->
  <rect x="370" y="880" width="260" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="906.4000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Persist Pending Snapshot Under</text>
  <text x="500.0" y="922.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Approved Schema &amp; Prevent Race</text>
  <!-- Node: node_persist_result -->
  <polygon points="500.0,980 580,1025.0 500.0,1070 420,1025.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1021.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Persistence</text>
  <text x="500.0" y="1036.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Succeeded?</text>
  <!-- Node: node_persist_fail -->
  <rect x="740" y="997.5" width="200" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="840.0" y="1021.4000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Persistence Failed</text>
  <text x="840.0" y="1037.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Retain Safe Input &amp; Retry</text>
  <!-- Node: node_handoff -->
  <rect x="380" y="1110" width="240" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1133.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Handoff to Module 4</text>
  <text x="500.0" y="1149.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Admin Moderation Review Queue</text>
  <!-- Node: node_handoff_check -->
  <polygon points="500.0,1205 580,1250.0 500.0,1295 420,1250.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1246.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Handoff</text>
  <text x="500.0" y="1261.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Accepted?</text>
  <!-- Node: node_handoff_reconcile -->
  <rect x="740" y="1222.5" width="200" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="840.0" y="1246.4" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Show Authoritative State</text>
  <text x="840.0" y="1262.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Reconcile Acknowledgement</text>
  <!-- Node: node_submitted_end -->
  <rect x="370" y="1335" width="260" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1358.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Persisted Pending Snapshot &amp;</text>
  <text x="500.0" y="1374.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Enqueued for Admin Review</text>
  <!-- Node: node_db -->
  <g>
    <path d="M 780 895 A 65.0 15 0 0 0 910 895 A 65.0 15 0 0 0 780 895 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 895 L 780 955 A 65.0 15 0 0 0 910 955 L 910 895" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 955 A 65.0 15 0 0 0 910 955" fill="none" stroke="#000000" stroke-width="1.8" />
    <text x="845.0" y="929.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Listings &amp;</text>
  </g>
  <!-- Node: node_end -->
  <rect x="420" y="1450" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="1480.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">END</text>

</svg>