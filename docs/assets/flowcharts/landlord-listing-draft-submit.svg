<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1680" width="1050" height="1680" style="background:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker for end of lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <!-- Arrow marker for start of lines (bidirectional) -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000000" />
    </marker>
    <!-- Pattern for grid background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Grid Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Flowchart Title -->
  <text x="525.0" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000" letter-spacing="1">SCRUM-125: LANDLORD LISTING DRAFT &amp; SUBMISSION FLOW</text>

  <!-- ==================== CONNECTING EDGES ==================== -->
  <!-- node_start -> node_auth -->
  <line x1="500.0" y1="130" x2="500.0" y2="165" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_auth -> node_auth_gate -->
  <path d="M 420 210 L 350 210" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="202" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_auth_gate -> node_auth -->
  <path d="M 255 182.5 L 255 140 L 500 140 L 500 165" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_auth -> node_role -->
  <line x1="500.0" y1="255" x2="500.0" y2="295" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="275" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_role -> node_deny -->
  <path d="M 420 340 L 350 340" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="332" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_deny -> node_end -->
  <path d="M 160 340 L 100 340 L 100 1475 L 420 1475" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_role -> node_editor -->
  <line x1="500.0" y1="385" x2="500.0" y2="425" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="405" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_editor -> node_save_choice -->
  <line x1="500.0" y1="485" x2="500.0" y2="525" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_save_choice -> node_draft_validate -->
  <path d="M 420 570 L 255 570 L 255 650" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="310" y="560" font-size="11" font-weight="normal" fill="#000000">Save Draft</text>
  <!-- node_draft_validate -> node_draft_result -->
  <line x1="255.0" y1="710" x2="255.0" y2="750" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_draft_result -> node_draft_saved -->
  <line x1="255.0" y1="840" x2="255.0" y2="880" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="262" y="855" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_draft_saved -> node_end -->
  <path d="M 150 907.5 L 100 907.5 L 100 1475 L 420 1475" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_draft_result -> node_draft_retry -->
  <path d="M 175 795 L 130 795 L 130 1002.5 L 150 1002.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="140" y="785" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_draft_retry -> node_editor -->
  <path d="M 150 1002.5 L 80 1002.5 L 80 455 L 370 455" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_save_choice -> node_submit_validate -->
  <line x1="500.0" y1="615" x2="500.0" y2="650" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="630" font-size="11" font-weight="normal" fill="#000000">Submit</text>
  <!-- node_submit_validate -> node_submit_valid -->
  <line x1="500.0" y1="710" x2="500.0" y2="750" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_submit_valid -> node_fix_input -->
  <path d="M 580 795 L 740 795" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="640" y="787" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_fix_input -> node_editor -->
  <path d="M 840 767.5 L 840 455 L 630 455" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_submit_valid -> node_pending_snapshot -->
  <line x1="500.0" y1="840" x2="500.0" y2="880" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="855" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_pending_snapshot -> node_db -->
  <path d="M 630 910 L 780 910" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="705" y="900" font-size="11" font-weight="normal" fill="#000000">Persist</text>
  <!-- node_pending_snapshot -> node_persist_result -->
  <line x1="500.0" y1="940" x2="500.0" y2="980" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_persist_result -> node_persist_fail -->
  <path d="M 580 1025 L 740 1025" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="640" y="1017" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_persist_fail -> node_editor -->
  <path d="M 840 997.5 L 860 997.5 L 860 455 L 630 455" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_persist_result -> node_handoff -->
  <line x1="500.0" y1="1070" x2="500.0" y2="1110" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="1085" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_handoff -> node_handoff_check -->
  <line x1="500.0" y1="1165" x2="500.0" y2="1205" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_handoff_check -> node_handoff_reconcile -->
  <path d="M 580 1250 L 740 1250" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="640" y="1242" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_handoff_reconcile -> node_end -->
  <path d="M 840 1277.5 L 840 1475 L 580 1475" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_handoff_check -> node_submitted_end -->
  <line x1="500.0" y1="1295" x2="500.0" y2="1335" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="1310" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_submitted_end -> node_end -->
  <line x1="500.0" y1="1390" x2="500.0" y2="1450" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== FLOWCHART NODES ==================== -->
  <!-- Node: node_start -->
  <rect x="420" y="80" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="110.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">START</text>
  <!-- Node: node_auth -->
  <polygon points="500.0,165 580,210.0 500.0,255 420,210.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="206.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Authenticated</text>
  <text x="500.0" y="221.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Session?</text>
  <!-- Node: node_auth_gate -->
  <rect x="160" y="182.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="206.39999999999998" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">SCRUM-121 Auth Gate</text>
  <text x="255.0" y="221.99999999999997" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Preserve Intent &amp; Sign In</text>
  <!-- Node: node_role -->
  <polygon points="500.0,295 580,340.0 500.0,385 420,340.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="336.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Landlord</text>
  <text x="500.0" y="351.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Role?</text>
  <!-- Node: node_deny -->
  <rect x="160" y="312.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="336.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Deny Access</text>
  <text x="255.0" y="352.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">No Records Disclosed</text>
  <!-- Node: node_editor -->
  <rect x="370" y="425" width="260" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="451.4" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Edit Property, Units, Photos &amp;</text>
  <text x="500.0" y="467.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Amenities (Draft-Safe Form)</text>
