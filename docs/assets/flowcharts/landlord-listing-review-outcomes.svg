<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1600" width="1050" height="1600" style="background:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker for end of lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <!-- Arrow marker for start of lines (bidirectional) -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000000" />
    </marker>
    <!-- Pattern for grid background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Grid Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Flowchart Title -->
  <text x="525.0" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000" letter-spacing="1">SCRUM-125: REVIEW OUTCOME &amp; OWNER LISTING MAINTENANCE</text>

  <!-- ==================== CONNECTING EDGES ==================== -->
  <!-- node_start -> node_read_outcome -->
  <line x1="500.0" y1="130" x2="500.0" y2="165" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_read_outcome -> node_owner_auth -->
  <line x1="500.0" y1="220" x2="500.0" y2="255" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_owner_auth -> node_invalid -->
  <path d="M 420 300 L 350 300" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="292" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_invalid -> node_end -->
  <path d="M 160 300 L 100 300 L 100 1525 L 420 1525" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_owner_auth -> node_decision_status -->
  <line x1="500.0" y1="345" x2="500.0" y2="380" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="360" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_decision_status -> node_approved_display -->
  <path d="M 580 425 L 840 425 L 840 495" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="670" y="417" font-size="11" font-weight="normal" fill="#000000">Approved</text>
  <!-- node_approved_display -> node_available_check -->
  <line x1="840.0" y1="550" x2="840.0" y2="590" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_available_check -> node_public_discovery -->
  <line x1="840.0" y1="680" x2="840.0" y2="725" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="848" y="700" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_available_check -> node_hidden_display -->
  <path d="M 920 635 L 950 635 L 950 847.5 L 940 847.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="955" y="730" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_public_discovery -> node_end -->
  <path d="M 940 752.5 L 970 752.5 L 970 1525 L 580 1525" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_hidden_display -> node_end -->
  <path d="M 940 847.5 L 950 847.5 L 950 1525 L 580 1525" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_decision_status -> node_rejected_display -->
  <line x1="500.0" y1="470" x2="500.0" y2="495" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="480" font-size="11" font-weight="normal" fill="#000000">Rejected</text>
  <!-- node_rejected_display -> node_resubmit_choice -->
  <line x1="500.0" y1="555" x2="500.0" y2="595" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_resubmit_choice -> node_remain_rejected -->
  <path d="M 420 640 L 350 640" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="632" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_remain_rejected -> node_end -->
  <path d="M 160 640 L 100 640 L 100 1525 L 420 1525" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_resubmit_choice -> node_correction_editor -->
  <line x1="500.0" y1="685" x2="500.0" y2="725" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="705" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_correction_editor -> node_validate_changes -->
  <line x1="500.0" y1="780" x2="500.0" y2="820" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_validate_changes -> node_fix_resubmit -->
  <path d="M 420 865 L 350 865" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="857" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_fix_resubmit -> node_correction_editor -->
  <path d="M 255 837.5 L 255 752.5 L 375 752.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_validate_changes -> node_persist_resubmit -->
  <line x1="500.0" y1="910" x2="500.0" y2="950" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="930" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_persist_resubmit -> node_db -->
  <path d="M 630 980 L 780 980" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="705" y="970" font-size="11" font-weight="normal" fill="#000000">Persist</text>
  <!-- node_persist_resubmit -> node_resubmit_result -->
  <line x1="500.0" y1="1010" x2="500.0" y2="1050" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_resubmit_result -> node_resubmit_fail -->
  <path d="M 420 1095 L 350 1095" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="1087" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_resubmit_fail -> node_correction_editor -->
  <path d="M 160 1095 L 130 1095 L 130 752.5 L 375 752.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_resubmit_result -> node_re_enqueue -->
  <line x1="500.0" y1="1140" x2="500.0" y2="1180" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="1160" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_re_enqueue -> node_queue_ack -->
  <line x1="500.0" y1="1235" x2="500.0" y2="1275" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_queue_ack -> node_reconcile_ack -->
  <path d="M 420 1320 L 350 1320" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="1312" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_reconcile_ack -> node_end -->
  <path d="M 160 1320 L 100 1320 L 100 1525 L 420 1525" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_queue_ack -> node_resubmitted_end -->
  <line x1="500.0" y1="1365" x2="500.0" y2="1405" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="1385" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_resubmitted_end -> node_end -->
  <line x1="500.0" y1="1460" x2="500.0" y2="1500" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== FLOWCHART NODES ==================== -->
  <!-- Node: node_start -->
  <rect x="420" y="80" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="110.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">START</text>
  <!-- Node: node_read_outcome -->
  <rect x="370" y="165" width="260" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="188.89999999999998" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Read Persisted Module 4 Outcome</text>
  <text x="500.0" y="204.49999999999997" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">for Owned Submitted Listing</text>
  <!-- Node: node_owner_auth -->
  <polygon points="500.0,255 580,300.0 500.0,345 420,300.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="296.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Authorized Owner &amp;</text>
  <text x="500.0" y="311.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Valid Record?</text>
  <!-- Node: node_invalid -->
  <rect x="160" y="272.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="296.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Unauthorized / Stale</text>
  <text x="255.0" y="312.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Return to Queue</text>
  <!-- Node: node_decision_status -->
  <polygon points="500.0,380 580,425.0 500.0,470 420,425.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="421.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Persisted Outcome</text>
  <text x="500.0" y="436.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Status?</text>
  <!-- Node: node_approved_display -->
  <rect x="740" y="495" width="200" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="840.0" y="518.9000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Display Approved State</text>
  <text x="840.0" y="534.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(Audit Evidence Recorded)</text>
  <!-- Node: node_available_check -->
  <polygon points="840.0,590 920,635.0 840.0,680 760,635.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="840.0" y="631.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Available Unit</text>
  <text x="840.0" y="646.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Present?</text>
  <!-- Node: node_public_discovery -->
  <rect x="740" y="725" width="200" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="840.0" y="748.9000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Discoverable in Search &amp; Map</text>
  <text x="840.0" y="764.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(SCRUM-116 Gate)</text>
  <!-- Node: node_hidden_display -->
  <rect x="740" y="820" width="200" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="840.0" y="843.9000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Approved But Hidden</text>
  <text x="840.0" y="859.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(No Available Units)</text>
  <!-- Node: node_rejected_display -->
  <rect x="370" y="495" width="260" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="521.4000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Display Rejected Status &amp;</text>
  <text x="500.0" y="537.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Actionable Moderation Reason</text>
  <!-- Node: node_resubmit_choice -->
  <polygon points="500.0,595 580,640.0 500.0,685 420,640.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="636.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Owner Corrects</text>
  <text x="500.0" y="651.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">&amp; Resubmits?</text>
  <!-- Node: node_remain_rejected -->
  <rect x="160" y="612.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="636.4000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Remain Rejected / Non-Public</text>
  <text x="255.0" y="652.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Preserve Audit Record</text>
  <!-- Node: node_correction_editor -->
  <rect x="375" y="725" width="250" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="748.9000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Owner Correction Editor</text>
  <text x="500.0" y="764.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(No Direct Moderation Writes)</text>
  <!-- Node: node_validate_changes -->
  <polygon points="500.0,820 580,865.0 500.0,910 420,865.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="861.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Role, Version &amp;</text>
  <text x="500.0" y="876.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Data Valid?</text>
  <!-- Node: node_fix_resubmit -->
  <rect x="160" y="837.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="861.4000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Field Errors / Conflict</text>
  <text x="255.0" y="877.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Reconcile in Editor</text>
  <!-- Node: node_persist_resubmit -->
  <rect x="370" y="950" width="260" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="976.4000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Persist Resubmitted Snapshot</text>
  <text x="500.0" y="992.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Under Approved Schema</text>
  <!-- Node: node_resubmit_result -->
  <polygon points="500.0,1050 580,1095.0 500.0,1140 420,1095.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1091.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Resubmission</text>
  <text x="500.0" y="1106.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Succeeded?</text>
  <!-- Node: node_resubmit_fail -->
  <rect x="160" y="1067.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="1091.4" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Submission Failed</text>
  <text x="255.0" y="1107.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Retain Input &amp; Retry</text>
  <!-- Node: node_re_enqueue -->
  <rect x="380" y="1180" width="240" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1203.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Re-enqueue to Module 4</text>
  <text x="500.0" y="1219.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Admin Moderation Queue</text>
  <!-- Node: node_queue_ack -->
  <polygon points="500.0,1275 580,1320.0 500.0,1365 420,1320.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1316.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Queue Handoff</text>
  <text x="500.0" y="1331.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Accepted?</text>
  <!-- Node: node_reconcile_ack -->
  <rect x="160" y="1292.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="1316.4" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Reconcile Authoritative State</text>
  <text x="255.0" y="1332.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(No Duplicate Submit)</text>
  <!-- Node: node_resubmitted_end -->
  <rect x="370" y="1405" width="260" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1428.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Persisted Pending Review</text>
  <text x="500.0" y="1444.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(Awaiting Admin Decision)</text>
  <!-- Node: node_db -->
  <g>
    <path d="M 780 965 A 65.0 15 0 0 0 910 965 A 65.0 15 0 0 0 780 965 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 965 L 780 1025 A 65.0 15 0 0 0 910 1025 L 910 965" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 1025 A 65.0 15 0 0 0 910 1025" fill="none" stroke="#000000" stroke-width="1.8" />
    <text x="845.0" y="999.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Listings DB</text>
  </g>
  <!-- Node: node_end -->
  <rect x="420" y="1500" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="1530.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">END</text>

</svg>