<text x="220.5" y="775.675" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">No / policy unresolved or fails:</text>
<text x="220.5" y="791.925" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">withhold contact; no bypass;</text>
<text x="220.5" y="808.175" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">offer inquiry if available</text>
