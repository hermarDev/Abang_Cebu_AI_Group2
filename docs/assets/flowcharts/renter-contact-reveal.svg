<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1050" width="1050" height="1050" style="background:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker for end of lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <!-- Arrow marker for start of lines (bidirectional) -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000000" />
    </marker>
    <!-- Pattern for grid background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Grid Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Flowchart Title -->
  <text x="525.0" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000" letter-spacing="1">SCRUM-127: LANDLORD CONTACT REVEAL FLOW</text>

  <!-- ==================== CONNECTING EDGES ==================== -->
  <!-- node_start -> node_auth -->
  <line x1="500.0" y1="130" x2="500.0" y2="165" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_auth -> node_gate -->
  <path d="M 420 210 L 350 210" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="202" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_gate -> node_auth -->
  <path d="M 255 182.5 L 255 140 L 500 140 L 500 165" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_auth -> node_listing_check -->
  <line x1="500.0" y1="255" x2="500.0" y2="295" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="275" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_listing_check -> node_deny_listing -->
  <path d="M 420 340 L 350 340" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="332" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_deny_listing -> node_end -->
  <path d="M 160 340 L 100 340 L 100 835 L 420 835" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_listing_check -> node_abuse_policy -->
  <line x1="500.0" y1="385" x2="500.0" y2="425" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="405" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_abuse_policy -> node_withhold -->
  <path d="M 420 470 L 350 470" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="462" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_withhold -> node_end -->
  <path d="M 160 470 L 100 470 L 100 835 L 420 835" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_abuse_policy -> node_contact_avail -->
  <line x1="500.0" y1="515" x2="500.0" y2="555" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="535" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_contact_avail -> node_none_avail -->
  <path d="M 580 600 L 740 600" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="640" y="592" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_none_avail -> node_end -->
  <path d="M 840 627.5 L 840 835 L 580 835" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_contact_avail -> node_reveal -->
  <line x1="500.0" y1="645" x2="500.0" y2="685" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="665" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_reveal -> node_db -->
  <path d="M 640 715 L 780 715" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="705" y="705" font-size="11" font-weight="normal" fill="#000000">Log Access</text>
  <!-- node_reveal -> node_end -->
  <line x1="500.0" y1="745" x2="500.0" y2="810" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== FLOWCHART NODES ==================== -->
  <!-- Node: node_start -->
  <rect x="420" y="80" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="110.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">START</text>
  <!-- Node: node_auth -->
  <polygon points="500.0,165 580,210.0 500.0,255 420,210.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="206.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Authenticated</text>
  <text x="500.0" y="221.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Renter?</text>
  <!-- Node: node_gate -->
  <rect x="160" y="182.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="206.39999999999998" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Guest: SCRUM-121 Gate</text>
  <text x="255.0" y="221.99999999999997" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Store Intent &amp; Sign In</text>
  <!-- Node: node_listing_check -->
  <polygon points="500.0,295 580,340.0 500.0,385 420,340.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="336.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Listing Approved</text>
  <text x="500.0" y="351.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">&amp; Landlord Linked?</text>
  <!-- Node: node_deny_listing -->
  <rect x="160" y="312.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="336.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Fail Closed / Safe Response</text>
  <text x="255.0" y="352.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">No Contact Disclosed</text>
  <!-- Node: node_abuse_policy -->
  <polygon points="500.0,425 580,470.0 500.0,515 420,470.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="466.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Policy &amp; Abuse</text>
  <text x="500.0" y="481.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Controls Pass?</text>
  <!-- Node: node_withhold -->
  <rect x="160" y="442.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="466.4" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Withhold Contact Data</text>
  <text x="255.0" y="482.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Offer In-App Inquiry</text>
  <!-- Node: node_contact_avail -->
  <polygon points="500.0,555 580,600.0 500.0,645 420,600.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="596.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Verified Contact</text>
  <text x="500.0" y="611.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Available?</text>
  <!-- Node: node_none_avail -->
  <rect x="740" y="572.5" width="200" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="840.0" y="596.4000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Contact Unavailable</text>
  <text x="840.0" y="612.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Offer In-App Inquiry</text>
  <!-- Node: node_reveal -->
  <rect x="360" y="685" width="280" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="711.4000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Return Minimum Verified Contact</text>
  <text x="500.0" y="727.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">to Authorized Renter &amp; Log Access</text>
  <!-- Node: node_db -->
  <g>
    <path d="M 780 685 A 65.0 15 0 0 0 910 685 A 65.0 15 0 0 0 780 685 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 685 L 780 745 A 65.0 15 0 0 0 910 745 L 910 685" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 745 A 65.0 15 0 0 0 910 745" fill="none" stroke="#000000" stroke-width="1.8" />
    <text x="845.0" y="719.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Landlord Contact</text>
  </g>
  <!-- Node: node_end -->
  <rect x="420" y="810" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="840.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">END</text>

</svg>