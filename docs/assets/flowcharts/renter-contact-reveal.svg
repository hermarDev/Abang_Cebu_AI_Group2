<text x="220.5" y="306.675" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">Guest: SCRUM-121</text>
<text x="220.5" y="322.925" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">Store safe same-origin intent for</text>
<text x="220.5" y="339.175" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">listing and reveal action</text>
<polygon points="650.0,483.0 775.0,550.5 650.0,618.0 525.0,550.5" fill="white" stroke="#111" stroke-width="1.5"/>
<text x="650" y="537.175" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">Revalidate target is</text>
<text x="650" y="553.425" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">approved and landlord</text>
<text x="650" y="569.675" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">is linked?</text>
<polygon points="940.0,504.0 1241.0,504.0 1217.0,598.0 916.0,598.0" fill="white" stroke="#111" stroke-width="1.5"/>
<text x="1078.5" y="537.675" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">No: fail closed; safe</text>
<text x="1078.5" y="553.925" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">unavailable response</text>
<text x="1078.5" y="570.175" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">No contact data returned</text>
<polygon points="650.0,702.0 800.0,799.0 650.0,896.0 500.0,799.0" fill="white" stroke="#111" stroke-width="1.5"/>
<text x="650" y="761.3" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">Approved</text>
<text x="650" y="777.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">contact-eligibility AND</text>
<text x="650" y="793.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">abuse controls defined and</text>
<text x="650" y="810.05" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">pass? (verification,</text>
<text x="650" y="826.3" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">consent, quotas</text>
<text x="650" y="842.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">unresolved; fail closed)</text>
