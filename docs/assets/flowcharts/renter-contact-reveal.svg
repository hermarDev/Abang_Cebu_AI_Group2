<text x="649.5" y="1215.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">Yes: return minimum contact data to</text>
<text x="649.5" y="1231.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">authorized renter only; record</text>
<text x="649.5" y="1248.05" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">minimal access event if policy</text>
