<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1150" width="1050" height="1150" style="background:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker for end of lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <!-- Arrow marker for start of lines (bidirectional) -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000000" />
    </marker>
    <!-- Pattern for grid background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Grid Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Flowchart Title -->
  <text x="525.0" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000" letter-spacing="1">SCRUM-127: SAVE / REMOVE FAVORITE LISTING</text>

  <!-- ==================== CONNECTING EDGES ==================== -->
  <!-- node_start -> node_auth -->
  <line x1="500.0" y1="130" x2="500.0" y2="165" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_auth -> node_gate -->
  <path d="M 420 210 L 350 210" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="202" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_gate -> node_auth -->
  <path d="M 255 182.5 L 255 140 L 500 140 L 500 165" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_auth -> node_action -->
  <line x1="500.0" y1="255" x2="500.0" y2="295" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="275" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_action -> node_approved -->
  <line x1="500.0" y1="385" x2="500.0" y2="425" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="405" font-size="11" font-weight="normal" fill="#000000">YES (Save)</text>
  <!-- node_action -> node_remove -->
  <path d="M 420 340 L 255 340 L 255 555" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="310" y="330" font-size="11" font-weight="normal" fill="#000000">NO (Remove)</text>
  <!-- node_approved -> node_unavailable -->
  <path d="M 580 470 L 740 470" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="640" y="462" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_unavailable -> node_end -->
  <path d="M 840 497.5 L 840 935 L 580 935" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_approved -> node_save -->
  <line x1="500.0" y1="515" x2="500.0" y2="555" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="535" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_save -> node_db -->
  <path d="M 630 585 L 780 585" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="705" y="575" font-size="11" font-weight="normal" fill="#000000">Upsert</text>
  <!-- node_save -> node_persist -->
  <line x1="500.0" y1="615" x2="500.0" y2="665" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_remove -> node_persist -->
  <path d="M 255 615 L 255 710 L 420 710" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_persist -> node_error -->
  <path d="M 420 710 L 350 710" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="702" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_error -> node_end -->
  <path d="M 160 710 L 100 710 L 100 935 L 420 935" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_persist -> node_confirm -->
  <line x1="500.0" y1="755" x2="500.0" y2="795" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="775" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_confirm -> node_end -->
  <line x1="500.0" y1="850" x2="500.0" y2="910" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== FLOWCHART NODES ==================== -->
  <!-- Node: node_start -->
  <rect x="420" y="80" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="110.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">START</text>
  <!-- Node: node_auth -->
  <polygon points="500.0,165 580,210.0 500.0,255 420,210.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="206.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Authenticated</text>
  <text x="500.0" y="221.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Renter?</text>
  <!-- Node: node_gate -->
  <rect x="160" y="182.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="206.39999999999998" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Guest: SCRUM-121 Gate</text>
  <text x="255.0" y="221.99999999999997" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Preserve Listing &amp; Action</text>
  <!-- Node: node_action -->
  <polygon points="500.0,295 580,340.0 500.0,385 420,340.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="336.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Requested Action</text>
  <text x="500.0" y="351.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">is Save?</text>
  <!-- Node: node_approved -->
  <polygon points="500.0,425 580,470.0 500.0,515 420,470.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="466.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Listing Approved</text>
  <text x="500.0" y="481.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">&amp; Available?</text>
  <!-- Node: node_unavailable -->
  <rect x="740" y="442.5" width="200" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="840.0" y="466.4" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Unavailable Listing</text>
  <text x="840.0" y="482.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Action Refused Safely</text>
  <!-- Node: node_save -->
  <rect x="370" y="555" width="260" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="581.4000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Upsert Favorite Association</text>
  <text x="500.0" y="597.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(Enforce Unique Renter/Listing)</text>
  <!-- Node: node_remove -->
  <rect x="150" y="555" width="210" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="581.4000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Delete Favorite Association</text>
  <text x="255.0" y="597.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(Idempotent Removal)</text>
  <!-- Node: node_persist -->
  <polygon points="500.0,665 580,710.0 500.0,755 420,710.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="706.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Persistence</text>
  <text x="500.0" y="721.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Succeeded?</text>
  <!-- Node: node_error -->
  <rect x="160" y="682.5" width="190" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="255.0" y="706.4000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Persistence Failed</text>
  <text x="255.0" y="722.0000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Safe Bounded Retry</text>
  <!-- Node: node_confirm -->
  <rect x="370" y="795" width="260" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="818.9000000000001" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Update Renter Saved State</text>
  <text x="500.0" y="834.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(Reflect Instant UI Toggle)</text>
  <!-- Node: node_db -->
  <g>
    <path d="M 780 560 A 65.0 15 0 0 0 910 560 A 65.0 15 0 0 0 780 560 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 560 L 780 620 A 65.0 15 0 0 0 910 620 L 910 560" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 620 A 65.0 15 0 0 0 910 620" fill="none" stroke="#000000" stroke-width="1.8" />
    <text x="845.0" y="594.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Saved</text>
  </g>
  <!-- Node: node_end -->
  <rect x="420" y="910" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="940.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">END</text>

</svg>