<text x="220.5" y="306.675" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">Guest: invoke SCRUM-121</text>
<text x="220.5" y="322.925" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">Preserve listing + action; do not</text>
<text x="220.5" y="339.175" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">store sensitive form text</text>
<polygon points="650.0,471.0 800.0,568.0 650.0,665.0 500.0,568.0" fill="white" stroke="#111" stroke-width="1.5"/>
<text x="650" y="530.3" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">Target eligible and schema</text>
<text x="650" y="546.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">mapping confirmed?</text>
<text x="650" y="562.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">(`inquiries` /</text>
<text x="650" y="579.05" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">`viewing_appointments`;</text>
<text x="650" y="595.3" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#111">owner gate, no assumed</text>
