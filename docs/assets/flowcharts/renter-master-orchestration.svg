<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1450" width="1050" height="1450" style="background:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker for end of lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <!-- Arrow marker for start of lines (bidirectional) -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000000" />
    </marker>
    <!-- Pattern for grid background -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Grid Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Flowchart Title -->
  <text x="525.0" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000" letter-spacing="1">SCRUM-127: MODULE 5 — RENTER MASTER ORCHESTRATION</text>

  <!-- ==================== CONNECTING EDGES ==================== -->
  <!-- node_start -> node_browse_map -->
  <line x1="500.0" y1="130.0" x2="500.0" y2="170.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_browse_map -> node_listing_select -->
  <line x1="500.0" y1="225.0" x2="500.0" y2="265.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_listing_select -> node_intent_fav -->
  <line x1="500.0" y1="325.0" x2="500.0" y2="365.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_intent_fav -> node_sub_fav -->
  <path d="M 400 407.5 L 370 407.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="399" font-size="11" font-weight="normal" fill="#000000">Favorite</text>
  <!-- node_sub_fav -> node_auth_check -->
  <path d="M 275 437.5 L 275 645 L 410 645" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_intent_fav -> node_intent_contact -->
  <line x1="500.0" y1="450.0" x2="500.0" y2="485.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="460" font-size="11" font-weight="normal" fill="#000000">Contact / Inquire</text>
  <!-- node_intent_contact -> node_sub_reveal -->
  <path d="M 410 527.5 L 370 527.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="519" font-size="11" font-weight="normal" fill="#000000">Reveal Phone</text>
  <!-- node_sub_reveal -> node_auth_check -->
  <path d="M 275 557.5 L 275 645 L 410 645" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_intent_contact -> node_sub_inquiry -->
  <path d="M 590 527.5 L 680 527.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="615" y="519" font-size="11" font-weight="normal" fill="#000000">Viewing Request</text>
  <!-- node_sub_inquiry -> node_auth_check -->
  <path d="M 780 557.5 L 780 645 L 590 645" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_auth_check -> node_gatekeeper_handoff -->
  <path d="M 410 645 L 370 645" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="637" font-size="11" font-weight="normal" fill="#000000">NO (Guest)</text>
  <!-- node_gatekeeper_handoff -> node_execute_action -->
  <path d="M 275 675 L 275 752.5 L 360 752.5" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_auth_check -> node_execute_action -->
  <line x1="500.0" y1="685.0" x2="500.0" y2="725.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="695" font-size="11" font-weight="normal" fill="#000000">YES (Auth)</text>
  <!-- node_execute_action -> node_db_renter -->
  <path d="M 640 752.5 L 780 752.5" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="675" y="742" font-size="11" font-weight="normal" fill="#000000">INSERT / UPDATE</text>
  <!-- node_execute_action -> node_mutation_success -->
  <line x1="500.0" y1="780.0" x2="500.0" y2="820.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_mutation_success -> node_error_toast -->
  <path d="M 410 860 L 360 860" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="375" y="852" font-size="11" font-weight="bold" fill="#000000">NO</text>
  <!-- node_error_toast -> node_end -->
  <path d="M 180 860 L 100 860 L 100 1275 L 420 1275" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_mutation_success -> node_dispatch_telemetry -->
  <line x1="500.0" y1="900.0" x2="500.0" y2="940.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="508" y="910" font-size="11" font-weight="bold" fill="#000000">YES</text>
  <!-- node_dispatch_telemetry -> node_notify_landlord_step -->
  <line x1="500.0" y1="995.0" x2="500.0" y2="1040.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_notify_landlord_step -> node_renter_confirmation -->
  <line x1="500.0" y1="1100.0" x2="500.0" y2="1145.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- node_renter_confirmation -> node_end -->
  <line x1="500.0" y1="1200.0" x2="500.0" y2="1250.0" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== FLOWCHART NODES ==================== -->
  <!-- Node: node_start -->
  <rect x="420" y="80" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="110.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">START: Renter Discovery Entry</text>
  <!-- Node: node_browse_map -->
  <polygon points="385,170 640,170 615,225 360,225" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="193.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Integrated Map Discovery Interface</text>
  <text x="500.0" y="209.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">(From Module 2: SCRUM-116 - 121)</text>
  <!-- Node: node_listing_select -->
  <polygon points="375,265 650,265 625,325 350,325" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="291.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Renter Selects Listing Pin / Drawer Card</text>
  <text x="500.0" y="307.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Inspects Pricing, Photos, &amp; Verification</text>
  <!-- Node: node_intent_fav -->
  <polygon points="500.0,365 600,407.5 500.0,450 400,407.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="404.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Is Action &#x27;Save Favorite&#x27;</text>
  <text x="500.0" y="419.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">or Contact Landlord?</text>
  <!-- Node: node_sub_fav -->
  <polygon points="180,377.5 370,377.5 370,418.3 275.0,437.5 180,418.3" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="275.0" y="391.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Sub-Process 5.1:</text>
  <text x="275.0" y="405.65000000000003" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Save / Remove Favorite Listing</text>
  <!-- Node: node_intent_contact -->
  <polygon points="500.0,485 590,527.5 500.0,570 410,527.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="524.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Contact Channel:</text>
  <text x="500.0" y="539.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Reveal Phone or Inquiry?</text>
  <!-- Node: node_sub_reveal -->
  <polygon points="180,497.5 370,497.5 370,538.3 275.0,557.5 180,538.3" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="275.0" y="511.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Sub-Process 5.2:</text>
  <text x="275.0" y="525.65" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Landlord Contact Reveal Flow</text>
  <!-- Node: node_sub_inquiry -->
  <polygon points="680,497.5 880,497.5 880,538.3 780.0,557.5 680,538.3" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="780.0" y="511.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Sub-Process 5.3:</text>
  <text x="780.0" y="525.65" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Renter Inquiry &amp; Viewing Request</text>
  <!-- Node: node_auth_check -->
  <polygon points="500.0,605 590,645.0 500.0,685 410,645.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="641.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">User Authenticated?</text>
  <text x="500.0" y="656.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">(Guest Session Intercept)</text>
  <!-- Node: node_gatekeeper_handoff -->
  <polygon points="180,615 370,615 370,655.8 275.0,675 180,655.8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="275.0" y="628.85" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Handoff to Sub-Process 2.5:</text>
  <text x="275.0" y="643.15" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Map Auth Gatekeeper (SCRUM-121)</text>
  <!-- Node: node_execute_action -->
  <rect x="360" y="725" width="280" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="748.9000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Execute Engagement Mutation with</text>
  <text x="500.0" y="764.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Validated User ID &amp; Session Token</text>
  <!-- Node: node_db_renter -->
  <g>
    <path d="M 780 732.5 A 90.0 15 0 0 0 960 732.5 A 90.0 15 0 0 0 780 732.5 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 732.5 L 780 772.5 A 90.0 15 0 0 0 960 772.5 L 960 732.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <path d="M 780 772.5 A 90.0 15 0 0 0 960 772.5" fill="none" stroke="#000000" stroke-width="1.8" />
    <text x="870.0" y="756.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Database (Supabase)</text>
  </g>
  <!-- Node: node_mutation_success -->
  <polygon points="500.0,820 590,860.0 500.0,900 410,860.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="856.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Database Operation</text>
  <text x="500.0" y="871.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000">Succeeded?</text>
  <!-- Node: node_error_toast -->
  <polygon points="205,832.5 360,832.5 335,887.5 180,887.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="270.0" y="856.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Display Error Toast / Retry Notice</text>
  <text x="270.0" y="872.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Preserve Intent / Draft State</text>
  <!-- Node: node_dispatch_telemetry -->
  <rect x="360" y="940" width="280" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="963.9000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Emit Engagement Telemetry &amp;</text>
  <text x="500.0" y="979.5000000000001" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Trigger In-App / Push Alerts</text>
  <!-- Node: node_notify_landlord_step -->
  <polygon points="350,1040 650,1040 650,1080.8 500.0,1100 350,1080.8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1053.85" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Sub-Process 3.3 Handoff:</text>
  <text x="500.0" y="1068.1499999999999" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Deliver Inquiry to Landlord (SCRUM-125)</text>
  <!-- Node: node_renter_confirmation -->
  <polygon points="385,1145 640,1145 615,1200 360,1200" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500.0" y="1168.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Update Renter UI: Show Confirmed Status</text>
  <text x="500.0" y="1184.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#333333">Add to Activity Timeline &amp; Saved Items</text>
  <!-- Node: node_end -->
  <rect x="420" y="1250" width="160" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
  <text x="500.0" y="1280.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">END: Renter Action</text>

</svg>