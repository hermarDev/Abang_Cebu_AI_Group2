<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f2742" flood-opacity="0.14"/>
    </filter>
    <filter id="shadow-pill" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f2742" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="map-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="ocean-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- 1. FULL BLEED MAP CANVAS -->
  <rect width="1440" height="900" fill="url(#map-bg)"/>

  <!-- Stylized Mactan Channel Coastline & Roads -->
  <path d="M 1120 0 Q 1160 300 1200 550 T 1320 900 L 1440 900 L 1440 0 Z" fill="#93c5fd" opacity="0.35"/>
  <path d="M 1240 0 Q 1280 320 1340 600 T 1440 900" stroke="#0284c7" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Arterial Cebu Road Network -->
  <!-- N. Bacalso Ave (Highway) -->
  <path d="M 0 650 Q 400 600 700 520 T 1200 450" stroke="#ffffff" stroke-width="12" fill="none"/>
  <path d="M 0 650 Q 400 600 700 520 T 1200 450" stroke="#cbd5e1" stroke-width="8" fill="none"/>
  
  <!-- Osmeña Blvd / Mango Ave -->
  <path d="M 680 900 L 720 500 L 850 200" stroke="#ffffff" stroke-width="10" fill="none"/>
  <path d="M 680 900 L 720 500 L 850 200" stroke="#cbd5e1" stroke-width="6" fill="none"/>
  
  <!-- Gov. Cuenco (Talamban) -->
  <path d="M 850 200 L 980 0" stroke="#ffffff" stroke-width="9" fill="none"/>
  <path d="M 850 200 L 980 0" stroke="#cbd5e1" stroke-width="5" fill="none"/>

  <!-- Landmark Polygons / Zones -->
  <!-- CIT-U Campus Zone -->
  <rect x="520" y="540" width="130" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" opacity="0.85"/>
  <text x="585" y="582" text-anchor="middle" class="font-sans" font-size="11" font-weight="700" fill="#92400e">CIT-U Main Campus</text>
  <text x="585" y="598" text-anchor="middle" class="font-sans" font-size="9" fill="#b45309">N. Bacalso Ave</text>

  <!-- Cebu IT Park Zone -->
  <rect x="800" y="240" width="160" height="110" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" opacity="0.85"/>
  <text x="880" y="290" text-anchor="middle" class="font-sans" font-size="11" font-weight="700" fill="#0f766e">Cebu IT Park</text>
  <text x="880" y="306" text-anchor="middle" class="font-sans" font-size="9" fill="#115e59">Salinas Dr, Lahug</text>

  <!-- 2. DYNAMIC PRICE MARKERS (OVER MAP CANVAS) -->
  <!-- Marker 1: Near CIT-U (Active Selection) -->
  <g transform="translate(680, 520)" filter="url(#shadow-pill)">
    <rect x="-42" y="-18" width="84" height="36" rx="18" fill="#047857" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" class="font-mono" font-size="13" font-weight="800" fill="#ffffff">₱2,500</text>
    <polygon points="-6,18 6,18 0,26" fill="#047857"/>
    <!-- Selected Card Callout Card -->
    <rect x="-90" y="-72" width="180" height="46" rx="8" fill="#0f2742" stroke="#047857" stroke-width="2"/>
    <text x="0" y="-52" text-anchor="middle" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">St. Jude Dormitory</text>
    <text x="0" y="-36" text-anchor="middle" class="font-sans" font-size="9.5" fill="#5eead4">350m from CIT-U Main Gate</text>
  </g>

  <!-- Marker 2: Urgello Room -->
  <g transform="translate(620, 420)" filter="url(#shadow-pill)">
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0f2742">₱3,200</text>
    <polygon points="-5,14 5,14 0,20" fill="#ffffff"/>
  </g>

  <!-- Marker 3: IT Park Studio -->
  <g transform="translate(940, 220)" filter="url(#shadow-pill)">
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0f2742">₱7,500</text>
    <polygon points="-5,14 5,14 0,20" fill="#ffffff"/>
  </g>

  <!-- Marker 4: Banilad Bedspace -->
  <g transform="translate(860, 110)" filter="url(#shadow-pill)">
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0f2742">₱1,800</text>
    <polygon points="-5,14 5,14 0,20" fill="#ffffff"/>
  </g>

  <!-- Marker 5: Capitol Room -->
  <g transform="translate(760, 360)" filter="url(#shadow-pill)">
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0f2742">₱4,800</text>
    <polygon points="-5,14 5,14 0,20" fill="#ffffff"/>
  </g>

  <!-- 3. TOP OVERLAY BUTTONS -->
  <!-- "Search This Area" Floating Button -->
  <g transform="translate(820, 24)" filter="url(#shadow-pill)">
    <rect x="-80" y="0" width="160" height="38" rx="19" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="-56" cy="19" r="6" stroke="#0d9488" stroke-width="2" fill="none"/>
    <text x="-42" y="23" class="font-sans" font-size="11.5" font-weight="700" fill="#0f2742">Search this area</text>
  </g>

  <!-- "Ask AI Finder" Floating Pill -->
  <g transform="translate(1330, 24)" filter="url(#shadow-pill)">
    <rect x="-95" y="0" width="190" height="42" rx="21" fill="#0f2742" stroke="#0d9488" stroke-width="1.5"/>
    <text x="-45" y="26" class="font-sans" font-size="12" font-weight="700" fill="#ffffff">✨ Ask Cebu AI</text>
    <rect x="42" y="10" width="34" height="22" rx="4" fill="#1e293b"/>
    <text x="59" y="25" text-anchor="middle" class="font-mono" font-size="10" fill="#94a3b8">⌘K</text>
  </g>

  <!-- 4. BOTTOM-RIGHT MAP HUD (Zoom + Geolocation) -->
  <g transform="translate(1380, 740)" filter="url(#shadow-pill)">
    <rect x="0" y="0" width="44" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="44" x2="44" y2="44" stroke="#e2e8f0" stroke-width="1"/>
    <text x="22" y="28" text-anchor="middle" class="font-sans" font-size="18" font-weight="600" fill="#0f2742">+</text>
    <text x="22" y="72" text-anchor="middle" class="font-sans" font-size="20" font-weight="600" fill="#0f2742">−</text>
    
    <!-- Geolocation GPS Button -->
    <rect x="0" y="98" width="44" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="22" cy="120" r="8" stroke="#047857" stroke-width="2.5" fill="none"/>
    <line x1="22" y1="108" x2="22" y2="112" stroke="#047857" stroke-width="2.5"/>
    <line x1="22" y1="128" x2="22" y2="132" stroke="#047857" stroke-width="2.5"/>
    <line x1="10" y1="120" x2="14" y2="120" stroke="#047857" stroke-width="2.5"/>
    <line x1="30" y1="120" x2="34" y2="120" stroke="#047857" stroke-width="2.5"/>
  </g>

  <!-- 5. SIGNATURE FLOATING LEFT CARD (Google Maps Style: 400px x 868px) -->
  <g transform="translate(16, 16)" filter="url(#shadow-card)">
    <rect width="400" height="868" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Search Input Bar -->
    <rect x="16" y="16" width="368" height="48" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="38" cy="40" r="6" stroke="#64748b" stroke-width="2" fill="none"/>
    <line x1="43" y1="45" x2="48" y2="50" stroke="#64748b" stroke-width="2"/>
    <text x="58" y="44" class="font-sans" font-size="13" font-weight="500" fill="#0f2742">CIT-U, N. Bacalso Ave, Cebu City</text>
    <circle cx="360" cy="40" r="9" fill="#e2e8f0"/>
    <text x="360" y="44" text-anchor="middle" class="font-sans" font-size="11" font-weight="700" fill="#64748b">×</text>

    <!-- Quick Category Pill Strip -->
    <g transform="translate(16, 76)">
      <!-- Pill 1 (Active) -->
      <rect x="0" y="0" width="70" height="32" rx="16" fill="#0f2742"/>
      <text x="35" y="20" text-anchor="middle" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">All (48)</text>

      <!-- Pill 2 -->
      <rect x="76" y="0" width="88" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="120" y="20" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#475569">Bedspace</text>

      <!-- Pill 3 -->
      <rect x="170" y="0" width="68" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="204" y="20" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#475569">Studio</text>

      <!-- Pill 4 -->
      <rect x="244" y="0" width="80" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="284" y="20" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#475569">Under ₱3k</text>

      <!-- Pill 5 (More Filters) -->
      <rect x="330" y="0" width="38" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="349" y="20" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#0f2742">⚙</text>
    </g>

    <!-- Results Subheader -->
    <line x1="16" y1="120" x2="384" y2="120" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="142" class="font-sans" font-size="12" font-weight="700" fill="#0f2742">48 rentals found near CIT-U</text>
    <text x="384" y="142" text-anchor="end" class="font-sans" font-size="11" fill="#64748b">Sort: Nearest v</text>

    <!-- RENTAL CARD 1 (ACTIVE HIGHLIGHT) -->
    <g transform="translate(16, 156)">
      <rect width="368" height="220" rx="12" fill="#ffffff" stroke="#047857" stroke-width="2"/>
      
      <!-- Card Image Carousel -->
      <rect x="0" y="0" width="368" height="120" rx="12" fill="#e2e8f0"/>
      <rect x="12" y="10" width="52" height="20" rx="4" fill="#0f2742" opacity="0.8"/>
      <text x="38" y="24" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#ffffff">1 / 6 photos</text>
      
      <circle cx="346" cy="20" r="14" fill="#ffffff" opacity="0.9"/>
      <text x="346" y="24" text-anchor="middle" class="font-sans" font-size="12" fill="#e11d48">❤</text>

      <!-- Card Details -->
      <rect x="12" y="130" width="60" height="18" rx="4" fill="#ccfbf1"/>
      <text x="42" y="143" text-anchor="middle" class="font-sans" font-size="9.5" font-weight="700" fill="#0f766e">BEDSPACE</text>

      <rect x="78" y="130" width="95" height="18" rx="4" fill="#dcfce7"/>
      <text x="125" y="143" text-anchor="middle" class="font-sans" font-size="9.5" font-weight="700" fill="#15803d">✓ Verified Landlord</text>

      <!-- Price -->
      <text x="12" y="172" class="font-mono" font-size="17" font-weight="800" fill="#0f2742">₱2,500 <tspan font-size="11" font-weight="400" fill="#64748b">/ month</tspan></text>
      <text x="356" y="170" text-anchor="end" class="font-sans" font-size="10" fill="#64748b">1 mo dep • Submetered elect.</text>

      <!-- Title & Location -->
      <text x="12" y="192" class="font-sans" font-size="12.5" font-weight="700" fill="#0f2742">St. Jude Dormitory - Male Room 3</text>
      <text x="12" y="206" class="font-sans" font-size="11" fill="#0d9488">📍 350m from CIT-U Main Gate (4 min walk)</text>
    </g>

    <!-- RENTAL CARD 2 -->
    <g transform="translate(16, 390)">
      <rect width="368" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Card Image -->
      <rect x="0" y="0" width="368" height="120" rx="12" fill="#e2e8f0"/>
      <rect x="12" y="10" width="52" height="20" rx="4" fill="#0f2742" opacity="0.8"/>
      <text x="38" y="24" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#ffffff">1 / 4 photos</text>
      
      <!-- Badges -->
      <rect x="12" y="130" width="48" height="18" rx="4" fill="#e0f2fe"/>
      <text x="36" y="143" text-anchor="middle" class="font-sans" font-size="9.5" font-weight="700" fill="#0369a1">STUDIO</text>

      <!-- Price -->
      <text x="12" y="172" class="font-mono" font-size="17" font-weight="800" fill="#0f2742">₱4,800 <tspan font-size="11" font-weight="400" fill="#64748b">/ month</tspan></text>
      <text x="356" y="170" text-anchor="end" class="font-sans" font-size="10" fill="#64748b">Own meter • Free Wi-Fi</text>

      <!-- Title & Location -->
      <text x="12" y="192" class="font-sans" font-size="12.5" font-weight="700" fill="#0f2742">Park Vista Studio Unit 2A</text>
      <text x="12" y="206" class="font-sans" font-size="11" fill="#0d9488">📍 800m from CIT-U • Near South Bus</text>
    </g>

    <!-- RENTAL CARD 3 (PARTIAL PEEK) -->
    <g transform="translate(16, 624)">
      <rect width="368" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="0" y="0" width="368" height="120" rx="12" fill="#e2e8f0"/>
      <text x="12" y="165" class="font-mono" font-size="17" font-weight="800" fill="#0f2742">₱1,800 / mo</text>
      <text x="12" y="190" class="font-sans" font-size="12" font-weight="700" fill="#0f2742">Urgello Cozy Bedspace</text>
    </g>

    <!-- Collapsible Chevron Toggle Button (<) -->
    <g transform="translate(400, 20)">
      <path d="M 0 0 L 24 6 Q 30 12 30 20 L 30 24 Q 30 32 24 38 L 0 44 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="28" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#0f2742">‹</text>
    </g>
  </g>
</svg>
