<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%">
  <defs>
    <filter id="m-shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2742" flood-opacity="0.16"/>
    </filter>
    <filter id="m-shadow-pill" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f2742" flood-opacity="0.14"/>
    </filter>
  </defs>

  <style>
    .m-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .m-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- 1. FULL BLEED MAP BACKGROUND -->
  <rect width="390" height="844" fill="#f1f5f9"/>

  <!-- Roads & Coastline -->
  <path d="M 330 0 Q 350 300 370 500 T 390 844" stroke="#93c5fd" stroke-width="40" fill="none" opacity="0.4"/>
  <path d="M 0 540 Q 180 500 390 420" stroke="#cbd5e1" stroke-width="12" fill="none"/>
  <path d="M 0 540 Q 180 500 390 420" stroke="#ffffff" stroke-width="8" fill="none"/>
  <path d="M 210 0 L 220 844" stroke="#cbd5e1" stroke-width="8" fill="none"/>
  <path d="M 210 0 L 220 844" stroke="#ffffff" stroke-width="5" fill="none"/>

  <!-- Landmark Zone: CIT-U -->
  <rect x="60" y="470" width="110" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
  <text x="115" y="500" text-anchor="middle" class="m-sans" font-size="10" font-weight="700" fill="#92400e">CIT-U Campus</text>
  <text x="115" y="514" text-anchor="middle" class="m-sans" font-size="8.5" fill="#b45309">N. Bacalso Ave</text>

  <!-- Map Price Pins -->
  <!-- Pin 1: Active Selection -->
  <g transform="translate(190, 480)" filter="url(#m-shadow-pill)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#047857" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" class="m-mono" font-size="11.5" font-weight="800" fill="#ffffff">₱2,500</text>
    <polygon points="-5,14 5,14 0,20" fill="#047857"/>
  </g>

  <!-- Pin 2 -->
  <g transform="translate(110, 360)" filter="url(#m-shadow-pill)">
    <rect x="-28" y="-12" width="56" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="m-mono" font-size="10" font-weight="700" fill="#0f2742">₱3,200</text>
    <polygon points="-4,12 4,12 0,16" fill="#ffffff"/>
  </g>

  <!-- Pin 3 -->
  <g transform="translate(260, 320)" filter="url(#m-shadow-pill)">
    <rect x="-28" y="-12" width="56" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="m-mono" font-size="10" font-weight="700" fill="#0f2742">₱4,800</text>
    <polygon points="-4,12 4,12 0,16" fill="#ffffff"/>
  </g>

  <!-- 2. FLOATING TOP SEARCH & CATEGORY BAR (SAFE AREA TOP) -->
  <g transform="translate(16, 48)" filter="url(#m-shadow-card)">
    <!-- Search Bar -->
    <rect width="358" height="50" rx="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="32" cy="25" r="5" stroke="#64748b" stroke-width="2" fill="none"/>
    <line x1="36" y1="29" x2="40" y2="33" stroke="#64748b" stroke-width="2"/>
    <text x="50" y="30" class="m-sans" font-size="12" font-weight="600" fill="#0f2742">CIT-U, N. Bacalso, Cebu</text>
    
    <circle cx="330" cy="25" r="14" fill="#0f2742"/>
    <text x="330" y="29" text-anchor="middle" class="m-sans" font-size="11" fill="#ffffff">✨</text>
  </g>

  <!-- Horizontal Filter Pills -->
  <g transform="translate(16, 110)">
    <rect x="0" y="0" width="76" height="32" rx="16" fill="#0f2742" filter="url(#m-shadow-pill)"/>
    <text x="38" y="20" text-anchor="middle" class="m-sans" font-size="11" font-weight="700" fill="#ffffff">All (48)</text>

    <rect x="82" y="0" width="84" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#m-shadow-pill)"/>
    <text x="124" y="20" text-anchor="middle" class="m-sans" font-size="11" font-weight="600" fill="#475569">Bedspace</text>

    <rect x="172" y="0" width="70" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#m-shadow-pill)"/>
    <text x="207" y="20" text-anchor="middle" class="m-sans" font-size="11" font-weight="600" fill="#475569">Studio</text>

    <rect x="248" y="0" width="80" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#m-shadow-pill)"/>
    <text x="288" y="20" text-anchor="middle" class="m-sans" font-size="11" font-weight="600" fill="#475569">Under ₱3k</text>

    <rect x="334" y="0" width="38" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#m-shadow-pill)"/>
    <text x="353" y="20" text-anchor="middle" class="m-sans" font-size="12" font-weight="700" fill="#0f2742">⚙</text>
  </g>

  <!-- Floating "Search this area" button -->
  <g transform="translate(195, 160)" filter="url(#m-shadow-pill)">
    <rect x="-65" y="0" width="130" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="0" y="20" text-anchor="middle" class="m-sans" font-size="10.5" font-weight="700" fill="#0f2742">↻ Search this area</text>
  </g>

  <!-- Floating Map Controls (Right Side above Bottom Sheet) -->
  <g transform="translate(332, 530)" filter="url(#m-shadow-pill)">
    <rect x="0" y="0" width="42" height="42" rx="21" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="21" cy="21" r="7" stroke="#047857" stroke-width="2.5" fill="none"/>
    <line x1="21" y1="9" x2="21" y2="13" stroke="#047857" stroke-width="2.5"/>
    <line x1="21" y1="29" x2="21" y2="33" stroke="#047857" stroke-width="2.5"/>
    <line x1="9" y1="21" x2="13" y2="21" stroke="#047857" stroke-width="2.5"/>
    <line x1="29" y1="21" x2="33" y2="21" stroke="#047857" stroke-width="2.5"/>
  </g>

  <!-- 3. GOOGLE MAPS STYLE 3-SNAP BOTTOM SHEET (MID STATE: 48dvh, ~400px height) -->
  <g transform="translate(0, 584)" filter="url(#m-shadow-card)">
    <rect width="390" height="260" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Drag Handle -->
    <rect x="175" y="10" width="40" height="5" rx="2.5" fill="#cbd5e1"/>

    <!-- Bottom Sheet Header -->
    <text x="20" y="38" class="m-sans" font-size="13" font-weight="700" fill="#0f2742">48 Rentals near CIT-U</text>
    <text x="370" y="38" text-anchor="end" class="m-sans" font-size="11" font-weight="600" fill="#0d9488">Sort: Nearest v</text>

    <!-- Horizontal Carousel Preview Card 1 -->
    <g transform="translate(16, 52)">
      <rect width="358" height="150" rx="14" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
      <rect x="8" y="8" width="110" height="134" rx="10" fill="#e2e8f0"/>
      <text x="63" y="78" text-anchor="middle" class="m-sans" font-size="10" fill="#64748b">[Photo 1/6]</text>

      <rect x="128" y="14" width="56" height="16" rx="4" fill="#ccfbf1"/>
      <text x="156" y="26" text-anchor="middle" class="m-sans" font-size="8.5" font-weight="700" fill="#0f766e">BEDSPACE</text>
      
      <rect x="190" y="14" width="80" height="16" rx="4" fill="#dcfce7"/>
      <text x="230" y="26" text-anchor="middle" class="m-sans" font-size="8.5" font-weight="700" fill="#15803d">✓ Verified</text>

      <text x="128" y="54" class="m-mono" font-size="15" font-weight="800" fill="#0f2742">₱2,500 <tspan font-size="10" font-weight="400" fill="#64748b">/ mo</tspan></text>
      <text x="128" y="74" class="m-sans" font-size="11.5" font-weight="700" fill="#0f2742">St. Jude Male Dorm</text>
      <text x="128" y="90" class="m-sans" font-size="10" fill="#0d9488">📍 350m to CIT-U Main Gate</text>

      <rect x="128" y="102" width="218" height="28" rx="6" fill="#047857"/>
      <text x="237" y="120" text-anchor="middle" class="m-sans" font-size="10.5" font-weight="700" fill="#ffffff">View Details &amp; Contact</text>
    </g>

    <!-- iOS Home Indicator bar -->
    <rect x="125" y="246" width="140" height="5" rx="2.5" fill="#0f172a" opacity="0.4"/>
  </g>
</svg>
