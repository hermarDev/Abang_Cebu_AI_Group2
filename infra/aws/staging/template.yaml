AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Unapplied, parameterized EC2 staging host proposal for AbangCebu Next.js.
  Creates billable resources if deployed; DEV-1 will not deploy this template.
Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Approved patched AL2023 standard x86_64 AMI ID for selected region; verify its release and patch level before deployment. Do not use the Minimal variant because bootstrap requires the preinstalled aws-cfn-bootstrap helper at /opt/aws/bin/cfn-signal.
  InstanceType:
    Type: String
    AllowedPattern: '^[a-z0-9.]+$'
    Description: Owner-approved instance type; deployment may incur charges.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing private staging subnet with approved outbound access.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing staging VPC containing SubnetId.
  AllowedHttpsCidr:
    Type: String
    AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/([0-9]|[12][0-9]|3[0-2])$'
    Description: Owner-approved IPv4 CIDR for public HTTPS ingress; IPv4 octets and prefix length must be valid.
  InstanceProfileName:
    Type: String
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,128}$'
    Description: Pre-created least-privilege instance profile; no IAM roles are created here.
  AppPort:
    Type: Number
    MinValue: 1024
    MaxValue: 65535
    Description: Owner-approved local application port; no application is installed by this host bootstrap.
  ProjectName:
    Type: String
    AllowedPattern: '^[A-Za-z0-9-]{1,32}$'
    Default: AbangCebu
    Description: Non-secret resource tag prefix.
  EnvironmentName:
    Type: String
    AllowedValues: [staging]
    Default: staging
Mappings:
  ArchitectureMap:
    x86_64:
      Al2023Parameter: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  StagingSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AbangCebu staging HTTPS ingress only; no SSH exposure.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedHttpsCidr
          Description: Approved HTTPS ingress; narrow CIDR before deployment.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound; review endpoint requirements and egress scope before deployment.
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web'
        - Key: Environment
          Value: !Ref EnvironmentName
  StagingInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          GroupSet:
            - !GetAtt StagingSecurityGroup.GroupId
          AssociatePublicIpAddress: false
          DeleteOnTermination: true
      IamInstanceProfile: !Ref InstanceProfileName
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          trap 'rc=$?; /opt/aws/bin/cfn-signal -e $rc --stack ${AWS::StackName} --resource StagingInstance --region ${AWS::Region}' EXIT
          dnf -y update
          dnf install -y nginx
          printf '%s\n' 'PermitRootLogin no' 'PasswordAuthentication no' 'KbdInteractiveAuthentication no' > /etc/ssh/sshd_config.d/99-staging-hardening.conf
          chmod 0600 /etc/ssh/sshd_config.d/99-staging-hardening.conf
          systemctl disable --now sshd
          cat > /etc/nginx/conf.d/staging-placeholder.conf.disabled <<'EOF'
          # Configure approved domain, TLS certificate and app upstream after DNS/certificate setup.
          # Do not expose app traffic until HTTPS smoke checks have passed.
          EOF
          chmod 0640 /etc/nginx/conf.d/staging-placeholder.conf.disabled
          nginx -t
          systemctl enable --now nginx
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web'
        - Key: Environment
          Value: !Ref EnvironmentName
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT20M
Outputs:
  InstanceId:
    Value: !Ref StagingInstance
    Description: Created only if an approved operator deploys this template.
  SecurityGroupId:
    Value: !GetAtt StagingSecurityGroup.GroupId
    Description: HTTPS-only ingress CIDR; no SSH ingress.
